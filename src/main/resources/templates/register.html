<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mars[loginPage]</title>

    <link rel="stylesheet" href="../../css/login.css">
</head>
<body style="background-image: linear-gradient(50deg, #000,85%, #c47033)">

    <div class="flex">
        <form th:action="@{/mars/register}" method="post">
            <h1>Register</h1>
            <input type="text" name="login"/>
            <input type="password" name="passwd"/>

            <input type="submit" value="Zarejestruj się" />
        </form>
    </div>

    <div th:unless="${c}">Nie udało się zarejstrować !!!</div>
</body>
</html>
