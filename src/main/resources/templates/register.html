<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mars[loginPage]</title>
</head>
<body>
    <h1>Register</h1>

    <form th:action="@{/mars/register}" method="post">

        <input type="text" name="login"/>
        <input type="password" name="passwd"/>

        <input type="submit" value="zarejestruj się" />
    </form>

    <div th:unless="${c}">Nie udało się zarejstrować !!!</div>
</body>
</html>
